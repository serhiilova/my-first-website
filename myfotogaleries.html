.container1 {

nav ul {

nav ul li {

}

nav ul li:hover {

.container {
    display: grid;
    grid-template-columns: 1fr;
    border: 6px solid #04AA6D;
    gap: 30px;
    padding:0;
    background-color: beige;
    align-content: space-around;
    justify-content: center;
    place-items: center;
    padding: 25px;
}

img {
    width: 100%;
    max-width: 100%;
    height: auto;
    border: 3px solid #04AA6D;
    cursor: pointer;
    object-fit: cover;
    transition: transform 0.5s ease;
}

img:hover {
    transform: scale(1.1);
}

#title {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: beige;
}

@media (min-width: 600px) {
  nav ul {
  display: flex;
  gap:10px;
  flex-direction: row;
  }

   nav ul li {
        margin-bottom: 0;
        flex: 1;
   }

   .container {
     grid-template-columns: repeat(2, 1fr);
   }
 }

@media (min-width: 992px) {
  .container {
    grid-template-columns: repeat(3, 1fr);
  }
}
